[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmap"
version = "0.1.0"
description = "Native project and network map workspace"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.4,<7"]

[project.scripts]
ghostmap = "ghostmap.app:main"

[tool.setuptools.package-data]
ghostmap = ["assets/*.svg"]
